<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LiveChat Bad-Rating Monitor</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<style>
  :root{--bg:#0b1120;--panel:#0f1a2e;--card:#121f38;--line:#233350;--txt:#e8eefc;--mut:#8ea6cc;--accent:#3b82f6;--red:#ff5d6c;--amber:#f59e0b;--green:#34d399;--violet:#8b5cf6}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 Inter,system-ui,Segoe UI,Roboto,Arial;color:var(--txt);
    background:radial-gradient(1200px 600px at 12% -10%,#17264a 0,transparent 60%),radial-gradient(1000px 500px at 100% 0,#0d2b40 0,transparent 55%),linear-gradient(180deg,#0a1120,#0b1220)}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .side{width:230px;flex:0 0 230px;background:linear-gradient(180deg,rgba(59,130,246,.10),rgba(139,92,246,.05)),#0b1426;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-weight:800;font-size:14px}
  .brand img{width:26px;height:26px}
  .nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mut);cursor:pointer;font-weight:600;font-size:13px}
  .nav a:hover{background:#14233f;color:var(--txt)}
  .nav a.active{background:linear-gradient(135deg,rgba(59,130,246,.35),rgba(139,92,246,.25));color:#fff;border:1px solid #3b82f6}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px}
  .side-foot button{width:100%}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:6;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:linear-gradient(90deg,rgba(59,130,246,.14),rgba(16,185,129,.08));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  input,select{background:#0b1426;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
  button{background:#182a49;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:linear-gradient(135deg,#3b82f6,#06b6d4);border-color:#3b82f6;color:#fff;font-weight:700}
  .q{padding:6px 10px;font-size:12px}
  #status{color:var(--mut);margin-left:auto;font-size:12px}
  .wrap{padding:16px;flex:1}
  .h2{font-size:15px;font-weight:800;margin:2px 0 12px}
  /* cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .card{background:linear-gradient(160deg,rgba(59,130,246,.16),rgba(139,92,246,.05)),var(--card);border:1px solid #2b3f63;border-radius:16px;padding:14px 16px;box-shadow:0 14px 34px -24px #000}
  .card .l{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px}
  .card .n{font-size:26px;font-weight:800;margin-top:6px;background:linear-gradient(135deg,#bfdbfe,#a7f3d0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .card.red .n{background:linear-gradient(135deg,#fecaca,#fda4af);-webkit-background-clip:text;background-clip:text}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr}.side{display:none}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
  .panel h3{margin:0 0 12px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  /* bars */
  .bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
  .bar .lbl{width:150px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .track{flex:1;background:#0b1426;border-radius:8px;height:16px;overflow:hidden}
  .bar .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
  .bar .fill.red{background:linear-gradient(90deg,#ef4444,#f59e0b)}
  .bar .v{width:44px;text-align:right;color:var(--mut)}
  /* trend columns */
  .trend{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
  .trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .trend .b{width:100%;background:linear-gradient(180deg,#ef4444,#f59e0b);border-radius:6px 6px 0 0;min-height:2px}
  .trend .d{color:var(--mut);font-size:10.5px;transform:rotate(-40deg)}
  /* tabs/table */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
  .tab{padding:7px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:#0b1426;font-size:12.5px}
  .tab.active{background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-color:#6366f1;color:#fff;font-weight:700}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:12.5px}
  th{background:linear-gradient(180deg,#12203c,#0d1729);color:#a9bde0;font-weight:700}
  tr.shared td{background:rgba(239,68,68,.10)}
  tr:hover td{background:#162443}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line)}
  .badge.bad{background:#3a1d24;color:var(--red);border-color:#5b2630}
  .badge.good{background:#123024;color:var(--green);border-color:#1d4d37}
  .badge.un{background:#242b3a;color:var(--mut)}
  a{color:#7ab7ff;text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
  a.ext{color:var(--green);font-weight:700;margin-left:6px}
  .empty{padding:40px;text-align:center;color:var(--mut)}
  .muted{color:var(--mut)}
  .chk{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12.5px}
  /* calendar */
  .cal-wrap{position:relative}
  .datebtn{display:flex;align-items:center;gap:6px}
  .cal{position:absolute;top:44px;left:0;z-index:30;width:280px;padding:10px;border-radius:12px;background:#0e1a30;border:1px solid var(--line);box-shadow:0 24px 50px -24px #000}
  .cal.hidden{display:none}
  .cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cal-hd button{padding:2px 12px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
  .cal-grid .dow{color:var(--mut);font-size:11px;padding:2px 0}
  .cal-grid .day{padding:6px 0;border-radius:8px;cursor:pointer}.cal-grid .day:hover{background:#1c2c4a}
  .cal-grid .day.sel{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-weight:700}
  .cal-grid .day.today{border:1px solid var(--green)}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(3,8,18,.72);display:none;align-items:flex-start;justify-content:center;z-index:20;padding:24px;overflow:auto}
  .modal.on{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(920px,100%)}
  .sheet .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .sheet .bd{padding:16px 18px}
  .rev{background:#0b1426;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .rev .kv{margin:5px 0}.rev .k{color:var(--mut);display:inline-block;min-width:130px}
  .sec-h{margin:12px 0 5px;font-weight:800;color:#93c5fd}.sec-h:first-child{margin-top:0}
  .tr{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
  .msg{padding:8px 12px;border-bottom:1px solid #1a263f;display:flex;gap:10px}
  .msg .who{min-width:120px;font-weight:700}
  .msg.customer .who{color:#fca5a5}.msg.agent .who{color:#93c5fd}.msg.bot .who{color:#a7f3d0}
  .msg .tm{color:var(--mut);font-size:11px;min-width:64px}
  .close{margin-left:auto}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="/favicon.svg"><span>Bad-Rating Monitor</span></div>
    <nav class="nav">
      <a data-view="overview" class="active">📊 Overview</a>
      <a data-view="ratings">⭐ Ratings</a>
      <a data-view="agents">🧑‍💼 Agents</a>
      <a data-view="groups">🏷️ Groups</a>
    </nav>
    <div class="side-foot">
      <button id="logout">⎋ Logout</button>
    </div>
  </aside>
  <div class="main">
    <header>
      <div class="cal-wrap">
        <button id="dateBtn" class="datebtn">📅 <span id="dateLabel">—</span></button>
        <div id="cal" class="cal hidden"><div class="cal-hd"><button id="calPrev">‹</button><span id="calTitle"></span><button id="calNext">›</button></div><div class="cal-grid" id="calGrid"></div></div>
      </div>
      <button class="q" id="qy">◀ Yest.</button>
      <button class="q" id="qt">Today ▶</button>
      <select id="range" title="Days"><option value="1">1 day</option><option value="7">7 days</option><option value="30">30 days</option></select>
      <select id="group"><option value="">All groups</option></select>
      <select id="type"><option value="">All issue types</option><option>Deposit</option><option>Withdrawal</option><option>OTP</option><option>Game</option><option>Promotions</option><option>Emotional</option><option>Account</option><option>Sign up</option><option>Other</option></select>
      <label class="chk"><input type="checkbox" id="ratedonly" checked> Only rated</label>
      <input id="search" placeholder="🔎 username or chat ID" />
      <button id="load" class="primary">Load</button>
      <button id="refresh" class="q">↻ Refresh</button>
      <button id="dl">⬇ Download</button>
      <span id="status">–</span>
    </header>
    <div class="wrap" id="content"></div>
  </div>
</div>
<div class="modal" id="modal"><div class="sheet">
  <div class="hd"><b id="m_title">Chat</b><a id="m_open" target="_blank">open in LiveChat ↗</a><button class="close" onclick="closeChat()">✕ Close</button></div>
  <div class="bd" id="m_body"></div>
</div></div>
<script>
let GROUPS={}, DATA=[], view="overview", tab="bad", SEARCH="", SEL_DATE=null, calMonth=null, loading=false;
const $=s=>document.querySelector(s);
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const lcLink=id=>`https://my.livechatinc.com/archives/${id}?query=${id}`;
(function(){const d=new Date();d.setDate(d.getDate()-1);SEL_DATE=ymd(d);document.getElementById('dateLabel').textContent=SEL_DATE;})();
const setStatus=t=>$("#status").textContent=t;
function setDate(v){SEL_DATE=v;document.getElementById('dateLabel').textContent=v;const d=new Date(v+'T00:00:00');calMonth=new Date(d.getFullYear(),d.getMonth(),1);}
function renderCal(){const y=calMonth.getFullYear(),m=calMonth.getMonth();$("#calTitle").textContent=calMonth.toLocaleString('en',{month:'long',year:'numeric'});
  const startDow=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=ymd(new Date());
  let h=['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<startDow;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;h+=`<div class="day${ds===SEL_DATE?' sel':''}${ds===today?' today':''}" data-d="${ds}">${d}</div>`;}
  $("#calGrid").innerHTML=h;document.querySelectorAll('#calGrid .day').forEach(el=>el.onclick=()=>{setDate(el.dataset.d);toggleCal(false);loadData(false);});}
function toggleCal(show){const c=$("#cal");if(show){if(!calMonth)setDate(SEL_DATE);renderCal();c.classList.remove('hidden');}else c.classList.add('hidden');}
document.addEventListener('click',e=>{if(!e.target.closest('.cal-wrap')&&!e.target.closest('#cal'))toggleCal(false);});
async function loadGroups(){GROUPS=await(await fetch('/api/groups')).json();const sel=$("#group");Object.entries(GROUPS).sort((a,b)=>(a[1]||'').localeCompare(b[1]||'')).forEach(([id,n])=>{const o=document.createElement('option');o.value=id;o.textContent=`${n} (${id})`;sel.appendChild(o);});}
const rated=()=>$("#ratedonly").checked?"1":"0";
function lastDates(n){const a=[];const d=new Date(SEL_DATE+"T00:00:00");for(let i=0;i<n;i++){a.push(ymd(d));d.setDate(d.getDate()-1);}return a;}
async function fetchReport(date,gid,force){const u=`/api/report?date=${date}&group=${gid}&rated=${rated()}${force?'&refresh=1':''}`;const r=await fetch(u);if(!r.ok)return[];const d=await r.json();return d.rows||[];}
async function loadData(force){
  if(loading)return;loading=true;
  const g=$("#group").value;let days=parseInt($("#range").value||"1");if(!g&&days>1){days=1;}
  DATA=[];const dates=lastDates(days);
  try{
    if(g){let i=0;for(const d of dates){setStatus(`loading ${g} · ${d} (${i+1}/${dates.length})`);DATA=DATA.concat(await fetchReport(d,g,force));i++;}}
    else{
      const ids=Object.keys(GROUPS);let done=0;const POOL=5;let idx=0;
      await new Promise(res=>{let active=0;const next=()=>{if(idx>=ids.length&&active===0){res();return;}
        while(active<POOL&&idx<ids.length){const gid=ids[idx++];active++;
          fetchReport(dates[0],gid,force).then(r=>{DATA=DATA.concat(r);}).catch(()=>{}).finally(()=>{active--;done++;setStatus(`loading all groups… ${done}/${ids.length}`);next();});}
        if(idx>=ids.length&&active===0)res();};next();});
    }
    setStatus(`loaded ${DATA.length} rows`);
  }catch(e){setStatus("error: "+e.message);}
  loading=false;renderAll();
}
function scoped(){const ty=$("#type").value;return ty?DATA.filter(r=>r.issue_type===ty):DATA;}
function counts(rows){const bad=rows.filter(r=>r.rating==='bad'),good=rows.filter(r=>r.rating==='good'),un=rows.filter(r=>r.rating==='unrated');
  const ur={};un.forEach(r=>{if(r.unrated_reason)ur[r.unrated_reason]=(ur[r.unrated_reason]||0)+1;});
  const rated=bad.length+good.length;
  return {total:rows.length,bad:bad.length,good:good.length,unrated:un.length,rated,bad_agent:bad.filter(r=>r.n_agents>0).length,bad_bot:bad.filter(r=>r.n_agents===0).length,bad_commented:bad.filter(r=>r.has_comment).length,good_commented:good.filter(r=>r.has_comment).length,negrate: rated?Math.round(bad.length/rated*100):0,badrate: rows.length?Math.round(bad.length/rows.length*100):0,unrated_reasons:ur};}
const VIEWS={all:r=>true,bad:r=>r.rating==='bad',bad_agent:r=>r.rating==='bad'&&r.n_agents>0,bad_bot:r=>r.rating==='bad'&&r.n_agents===0,good:r=>r.rating==='good',unrated:r=>r.rating==='unrated',rated_commented:r=>(r.rating==='bad'||r.rating==='good')&&r.has_comment,bad_commented:r=>r.rating==='bad'&&r.has_comment,good_commented:r=>r.rating==='good'&&r.has_comment};
const TABS=[["bad","Bad (all)"],["bad_agent","Bad (agent)"],["bad_bot","Bad (bot only)"],["good","Good ratings"],["unrated","Unrated"],["rated_commented","Rated & commented"],["bad_commented","Bad & commented"],["good_commented","Good & commented"],["all","All chats"]];
const rb=r=>r==='bad'?'<span class="badge bad">BAD</span>':r==='good'?'<span class="badge good">GOOD</span>':'<span class="badge un">UNRATED</span>';

function renderAll(){const rows=scoped();const c=counts(rows);
  if(view==='overview')renderOverview(rows,c);
  else if(view==='ratings')renderRatings(rows,c);
  else if(view==='agents')renderAgents(rows);
  else renderGroups(rows);}

function kpi(label,n,red){return `<div class="card ${red?'red':''}"><div class="l">${label}</div><div class="n">${n}</div></div>`;}
function bars(items,red){const max=Math.max(1,...items.map(i=>i[1]));return items.map(([k,v])=>`<div class="bar"><div class="lbl" title="${k}">${k}</div><div class="track"><div class="fill ${red?'red':''}" style="width:${v/max*100}%"></div></div><div class="v">${v}</div></div>`).join('')||'<div class="muted">No data</div>';}
function renderOverview(rows,c){
  const bad=rows.filter(r=>r.rating==='bad');
  const byIssue={};bad.forEach(r=>byIssue[r.issue_type]=(byIssue[r.issue_type]||0)+1);
  const issueItems=Object.entries(byIssue).sort((a,b)=>b[1]-a[1]);
  const byDate={};bad.forEach(r=>{const d=(r.time||'').slice(0,10);byDate[d]=(byDate[d]||0)+1;});
  const dates=Object.keys(byDate).sort();
  const maxD=Math.max(1,...dates.map(d=>byDate[d]));
  const trend=dates.length?`<div class="trend">${dates.map(d=>`<div class="col"><div class="v muted" style="font-size:11px">${byDate[d]}</div><div class="b" style="height:${byDate[d]/maxD*120}px"></div><div class="d">${d.slice(5)}</div></div>`).join('')}</div>`:'<div class="muted">No bad ratings in range</div>';
  const byAgent={};bad.forEach(r=>{if((r.agents||[]).length)r.agents.forEach(a=>byAgent[a.name]=(byAgent[a.name]||0)+1);else byAgent['(bot only)']=(byAgent['(bot only)']||0)+1;});
  const agentItems=Object.entries(byAgent).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $("#content").innerHTML=`
    <div class="cards">${kpi('Total chats',c.total)}${kpi('Bad',c.bad,1)}${kpi('Bad rate %',c.badrate,1)}${kpi('Negative rate %',c.negrate,1)}${kpi('Bad (bot only)',c.bad_bot)}${kpi('Bad & commented',c.bad_commented)}</div>
    <div class="grid2">
      <div class="panel"><h3>Bad ratings by day</h3>${trend}</div>
      <div class="panel"><h3>Top issues (bad)</h3>${bars(issueItems,1)}</div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Top agents by bad ratings</h3>${bars(agentItems,1)}</div>
      <div class="panel"><h3>Why chats are unrated</h3>${bars(Object.entries(c.unrated_reasons||{}).sort((a,b)=>b[1]-a[1]),0)}</div>
    </div>`;
}
function renderRatings(rows,c){
  $("#content").innerHTML=`
    <div class="cards">${kpi('Total',c.total)}${kpi('Bad',c.bad,1)}${kpi('Bad (agent)',c.bad_agent,1)}${kpi('Bad (bot only)',c.bad_bot)}${kpi('Good',c.good)}${kpi('Unrated',c.unrated)}</div>
    <div class="tabs">${TABS.map(([k,l])=>`<div class="tab ${k===tab?'active':''}" data-k="${k}">${l}</div>`).join('')}</div>
    <div id="sum"></div><div id="tbl"></div>`;
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.k;renderAll();});
  renderSum(c);renderTable(rows);
}
function renderSum(c){const el=$("#sum");if(!el)return;
  if(tab==='unrated'&&c.unrated_reasons&&Object.keys(c.unrated_reasons).length){const r=Object.entries(c.unrated_reasons).sort((a,b)=>b[1]-a[1]);const t=r.reduce((s,[,v])=>s+v,0)||1;el.innerHTML='<div class="panel"><h3>Why unrated</h3>'+r.map(([k,v])=>`${v} (${(v/t*100).toFixed(0)}%) — ${k}`).join('<br>')+'</div>';}else el.innerHTML='';}
function renderTable(rows){
  let sel=rows.filter(VIEWS[tab]||VIEWS.bad).filter(r=>!SEARCH||(r.customer||'').toLowerCase().includes(SEARCH)||(r.chat_id||'').toLowerCase().includes(SEARCH));
  const per=(tab==='bad'||tab==='bad_agent');let flat=[];
  if(per)sel.forEach(r=>{if((r.agents||[]).length)r.agents.forEach(a=>flat.push([r,a.name]));else flat.push([r,'']);});else flat=sel.map(r=>[r,'']);
  const el=$("#tbl");if(!el)return;
  if(!flat.length){el.innerHTML='<div class="empty">No rows.</div>';return;}
  const head=`<tr><th>Time</th><th>Group</th><th>Chat</th><th>Customer</th><th>Rating</th><th>Issue</th><th>${per?'Agent':'Agents'}</th><th>Bot</th><th>Reason / Class</th><th>Problem</th></tr>`;
  const body=flat.map(([r,an])=>{const sh=r.n_agents>1;const names=(r.agents||[]).map(a=>a.name).filter(Boolean).join(', ');
    const share=sh?` <a class="badge bad" title="Agents: ${names}" onclick="openChat('${r.chat_id}')">SHARED ×${r.n_agents} ↗</a>`:'';
    const bots=(r.bots||[]).join(', ')||(r.n_agents===0?'<span class="badge bad">BOT ONLY</span>':'');
    return `<tr class="${sh?'shared':''}"><td>${r.time||''}</td><td>${r.group_name||''}</td>
      <td><a onclick="openChat('${r.chat_id}')">${r.chat_id}</a><a class="ext" href="${lcLink(r.chat_id)}" target="_blank">↗</a></td>
      <td>${r.customer||''}</td><td>${rb(r.rating)} ${r.has_comment?'💬':''}</td><td>${r.issue_type||''}</td>
      <td>${per?an:names}${share}</td><td>${bots}</td><td>${r.rating==='unrated'?(r.unrated_reason||''):(r.classification||[]).join(', ')}</td><td class="muted">${(r.problem||'').slice(0,110)}</td></tr>`;}).join('');
  el.innerHTML=`<table>${head}${body}</table>`;
}
function renderAgents(rows){
  const bad=rows.filter(r=>r.rating==='bad'),good=rows.filter(r=>r.rating==='good');
  const agg={};
  const bump=(name,key)=>{agg[name]=agg[name]||{bad:0,good:0,shared:0};agg[name][key]++;};
  bad.forEach(r=>{if((r.agents||[]).length)r.agents.forEach(a=>{bump(a.name,'bad');if(r.n_agents>1)agg[a.name].shared++;});else bump('(bot only)','bad');});
  good.forEach(r=>{if((r.agents||[]).length)r.agents.forEach(a=>bump(a.name,'good'));else bump('(bot only)','good');});
  const list=Object.entries(agg).map(([n,v])=>({n,...v,rate:v.bad+v.good?Math.round(v.bad/(v.bad+v.good)*100):0})).sort((a,b)=>b.bad-a.bad);
  $("#content").innerHTML=`<div class="panel"><h3>Agent leaderboard (bad ratings)</h3><table><tr><th>Agent</th><th>Bad</th><th>Good</th><th>Bad %</th><th>Shared</th></tr>${
    list.map(a=>`<tr><td>${a.n}</td><td><span class="badge bad">${a.bad}</span></td><td><span class="badge good">${a.good}</span></td><td>${a.rate}%</td><td>${a.shared}</td></tr>`).join('')}</table></div>`;
}
function renderGroups(rows){
  const by={};rows.forEach(r=>{const k=r.group_name||('Group '+r.group_id);by[k]=by[k]||{bad:0,good:0,un:0};if(r.rating==='bad')by[k].bad++;else if(r.rating==='good')by[k].good++;else by[k].un++;});
  const list=Object.entries(by).map(([n,v])=>({n,...v,rate:v.bad+v.good?Math.round(v.bad/(v.bad+v.good)*100):0})).sort((a,b)=>b.bad-a.bad);
  $("#content").innerHTML=`<div class="panel"><h3>Groups (bad ratings)</h3><table><tr><th>Group</th><th>Bad</th><th>Good</th><th>Unrated</th><th>Bad %</th></tr>${
    list.map(g=>`<tr><td>${g.n}</td><td><span class="badge bad">${g.bad}</span></td><td><span class="badge good">${g.good}</span></td><td>${g.un}</td><td>${g.rate}%</td></tr>`).join('')}</table></div>`;
}
function openChat(id){const r=DATA.find(x=>x.chat_id===id);if(!r)return;const m=$("#modal");m.classList.add('on');
  $("#m_title").textContent=`Chat ${r.chat_id} · ${r.group_name} · ${r.time}`;$("#m_open").href=lcLink(r.chat_id);
  const rev=`<div class="rev">
    <div class="sec-h">📝 Summary</div>
    <div class="kv"><span class="k">Customer</span> <b>${r.customer}</b></div>
    <div class="kv"><span class="k">Group</span> ${r.group_name} (${r.group_id})</div>
    <div class="kv"><span class="k">Rating</span> ${rb(r.rating)} ${r.rating_label||''} ${r.has_comment?'💬':''}</div>
    <div class="kv"><span class="k">Issue Type</span> <b>${r.issue_type||'—'}</b>${r.concern?` <span class="muted">(form: ${r.concern})</span>`:''}</div>
    <div class="kv"><span class="k">Agents</span> ${(r.agents||[]).map(a=>a.name).join(', ')||'—'} ${r.n_agents>1?`<span class="badge bad">SHARED ×${r.n_agents}</span>`:''}</div>
    <div class="kv"><span class="k">Bot(s)</span> ${(r.bots||[]).join(', ')||(r.n_agents===0?'<span class="badge bad">BOT ONLY</span>':'—')}</div>
    <div class="sec-h">🔎 Review</div>
    <div class="kv"><span class="k">Problem</span> ${r.problem||'—'}</div>
    <div class="kv"><span class="k">Error / Root cause</span> ${r.error||'—'}</div>
    <div class="kv"><span class="k">Classification</span> ${(r.classification||[]).join(', ')||'—'}</div>
    <div class="sec-h">✅ Solution</div><div class="kv">${r.suggestion||'—'}</div></div>`;
  const tr=(r.transcript||[]).map(mm=>`<div class="msg ${mm.role}"><span class="who">${mm.name||mm.role}</span><span class="tm">${mm.t||''}</span><span>${(mm.text||'').replace(/</g,'&lt;')}</span></div>`).join('');
  $("#m_body").innerHTML=rev+`<div class="tr">${tr||'<div class="empty">No messages</div>'}</div>`;}
function closeChat(){$("#modal").classList.remove('on');}
function download(){let sel=scoped().filter(VIEWS[tab]||VIEWS.bad);
  if(view!=='ratings')sel=scoped(); // overview/agents/groups export current scope
  const H=["Time","Group","Group ID","Chat ID","Link","Customer","Rating","Issue","Agents","Bot","Classification","Problem","Error","Solution"];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[H.map(q).join(',')];
  sel.forEach(r=>lines.push([r.time,r.group_name,r.group_id,r.chat_id,lcLink(r.chat_id),r.customer,r.rating,r.issue_type,(r.agents||[]).map(a=>a.name).join('; '),(r.bots||[]).join('; '),(r.classification||[]).join('; '),r.problem,r.error,r.suggestion].map(q).join(',')));
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`LiveChat_${view}_${SEL_DATE}.csv`;a.click();}
document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>{view=a.dataset.view;document.querySelectorAll('.nav a').forEach(x=>x.classList.toggle('active',x===a));renderAll();});
$("#load").onclick=()=>loadData(false);
$("#refresh").onclick=()=>loadData(true);
$("#dl").onclick=download;
$("#group").onchange=()=>loadData(false);$("#type").onchange=renderAll;$("#ratedonly").onchange=()=>loadData(false);$("#range").onchange=()=>loadData(false);
$("#dateBtn").onclick=e=>{e.stopPropagation();toggleCal($("#cal").classList.contains('hidden'));};
$("#calPrev").onclick=e=>{e.stopPropagation();calMonth.setMonth(calMonth.getMonth()-1);renderCal();};
$("#calNext").onclick=e=>{e.stopPropagation();calMonth.setMonth(calMonth.getMonth()+1);renderCal();};
$("#qy").onclick=()=>{const d=new Date();d.setDate(d.getDate()-1);setDate(ymd(d));loadData(false);};
$("#qt").onclick=()=>{const d=new Date();setDate(ymd(d));loadData(false);};
$("#search").oninput=e=>{SEARCH=e.target.value.trim().toLowerCase();renderAll();};
$("#logout").onclick=async()=>{try{await fetch('/api/logout',{method:'POST'});}catch(e){}location.href='/';};
loadGroups();
</script>
